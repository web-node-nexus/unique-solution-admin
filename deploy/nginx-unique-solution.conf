# Unique Solution admin — own port so it does not touch
# AR-water-tank / trade-fair sites on :80
#
# Copy to: /etc/nginx/sites-available/unique-solution
# Then: ln -s /etc/nginx/sites-available/unique-solution /etc/nginx/sites-enabled/
#        nginx -t && systemctl reload nginx

server {
    listen 8088;
    listen [::]:8088;
    server_name 94.103.163.218;

    root /var/www/unique-solution/public;
    index index.php;

    client_max_body_size 32M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
