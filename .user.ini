; Raise limits so large product specification HTML can be saved
; (~10MB text ≈ hundreds of thousands of words depending on formatting)
; Image uploads allow up to 5 MB (validation) — PHP must accept at least that.
post_max_size = 128M
upload_max_filesize = 64M
memory_limit = 512M
max_input_time = 300
max_execution_time = 300
max_input_vars = 10000
